[package]
name = "quill"
version = "0.0.0-local"
edition = "2024"
license-file = "LICENSE.md"

[dependencies]
anyhow = "1.0.104"
futures = "0.3"
goose = { git = "https://github.com/aaif-goose/goose", rev = "591edd47cf2cfea4957d720c607cf2a4def8673d", features = ["rustls-tls"] }
home = "0.5.12"
goose-mcp = { git = "https://github.com/aaif-goose/goose", rev = "591edd47cf2cfea4957d720c607cf2a4def8673d", default-features = false, features = ["bundled-mcp"] }
gpui-kit = { version = "0.6.6", features = ["tree-sitter-yaml"] }
rmcp = { version = "3.8.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1.54.1", features = ["full"] }
self_update = { version = "1.3.3", default-features = false, features = [
  "github",
  "reqwest",
  "rustls",
  "async",
  "archive-tar",
  "compression-tar-gz",
  "archive-zip",
  "compression-zip-deflate",
  "checksums",
] }
semver = "1.0.28"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1.34"
