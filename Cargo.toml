[package]
name = "quill"
version = "0.0.0-local"
edition = "2024"
license-file = "LICENSE.md"

[dependencies]
anyhow = "1.0.104"
dunce = "1.0.5"
futures = "0.3"
home = "0.5.12"
gpui-kit = { version = "0.6.6", features = ["tree-sitter-yaml"] }
rmcp = { version = "3.8.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
self_update = { version = "1.3.3", default-features = false, features = [
  "github",
  "reqwest",
  "rustls",
  "async",
  "archive-tar",
  "compression-tar-gz",
  "archive-zip",
  "compression-zip-deflate",
  "checksums",
] }
semver = "1.0.28"

# Bump both revs together: `git ls-remote https://github.com/aaif-goose/goose main`
goose ={ git = "https://github.com/aaif-goose/goose", rev = "b23d21cabd9b4de0c045dcdd731821a3a15c2bfc", features = ["rustls-tls"] }
goose-mcp = { git = "https://github.com/aaif-goose/goose", rev = "b23d21cabd9b4de0c045dcdd731821a3a15c2bfc", default-features = false, features = ["bundled-mcp"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1.34"
